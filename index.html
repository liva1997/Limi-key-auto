<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMI SMART KEY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;display:flex;justify-content:center;color:#fff}
.p{width:100%;max-width:390px;min-height:100vh;padding:10px 14px;background:radial-gradient(circle at 50% 28%,#0a1f44,#000 78%)}
.top{display:flex;justify-content:flex-end;align-items:center}
.gear{width:38px;height:38px;border-radius:50%;background:#111827;border:1px solid #475569;display:flex;align-items:center;justify-content:center;font-size:20px}
.bt{width:42px;height:42px;border-radius:50%;background:#0b1e3d;border:2px solid #3b82f6;display:flex;align-items:center;justify-content:center;color:#60a5fa;font-size:20px;box-shadow:0 0 12px #2563eb;margin-left:10px}
.rings{width:130px;height:38px;margin:8px auto 2px;position:relative}
.rings i{position:absolute;width:38px;height:38px;border:3px solid #d1d5db;border-radius:50%}
.rings i:nth-child(1){left:0}.rings i:nth-child(2){left:31px}.rings i:nth-child(3){left:62px}.rings i:nth-child(4){left:93px}
h1{text-align:center;font-size:28px;font-style:italic;text-shadow:0 0 12px #3b82f6}
h1 span{color:#dbeafe}
.sub{text-align:center;font-size:14px;color:#e2e8f0;margin:3px 0 8px}
.sub:before,.sub:after{content:"—";color:#94a3b8;margin:0 6px}
.pill{width:fit-content;margin:0 auto;background:#0f172a;border:1.5px solid #38bdf8;padding:5px 18px;font-size:14px;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.conn{text-align:right;color:#4ade80;font-size:11px;margin-top:4px}
.keywrap{width:195px;margin:14px auto 12px;filter:drop-shadow(0 0 20px #2563eb)}
.key{padding:9px;background:linear-gradient(90deg,#4b5563,#f9fafb 20%,#9ca3af 45%,#fff 60%,#6b7280 85%,#374151);border-radius:95px 95px 55px 55px/70px 70px 95px 95px}
.inner{background:linear-gradient(180deg,#111827,#000 45%,#1f2937);border-radius:86px 86px 46px 46px/62px 62px 86px 86px;overflow:hidden;border:1px solid #000}
.kb{height:98px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-bottom:3px solid #374151;width:100%;cursor:pointer}
.kb:last-of-type{height:68px}
.kb svg{width:52px;height:52px}
.audi-sm{height:42px;display:flex;justify-content:center;align-items:center;position:relative;width:84px;margin:0 auto}
.audi-sm i{position:absolute;width:21px;height:21px;border:2.5px solid #e5e7eb;border-radius:50%}
.audi-sm i:nth-child(1){left:0}.audi-sm i:nth-child(2){left:18px}.audi-sm i:nth-child(3){left:36px}.audi-sm i:nth-child(4){left:54px}
.row{display:flex;gap:9px}
.box{flex:1;background:linear-gradient(180deg,#0f1e3d,#050a14);border:2px solid #3b82f6;border-radius:16px;padding:10px 2px;text-align:center;box-shadow:0 0 12px #1d4ed8;cursor:pointer}
.box svg{width:42px;height:36px}
.box b{display:block;font-size:15px;margin-top:2px}
.box small{color:#cbd5e1;font-size:11px}
.carbox{margin-top:10px;background:#040814;border:1px solid #1e40af;border-radius:14px;padding:6px;display:flex;align-items:center;gap:6px}
.carbox img{width:150px;height:72px;object-fit:cover;border-radius:8px}
.ct{flex:1;text-align:center;font-size:12px;line-height:1.35}
.sb{width:70px;height:70px;border-radius:50%;border:3px solid #38bdf8;background:#0f172a;color:#fff;font-weight:bold;font-size:12px;box-shadow:0 0 16px #0284c7;cursor:pointer}
.sb.on{background:#14532d;border-color:#4ade80}
.bot{margin-top:10px;background:#0a1120;border:1px solid #334155;border-radius:30px;padding:9px 12px;display:flex;justify-content:space-between;font-size:13px}
.g{color:#4ade80}
#m{text-align:center;color:#7dd3fc;font-weight:bold;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="p">
<div class="top"><div class="gear">⚙️</div><div class="bt">ᛒ</div></div>
<div class="rings"><i></i><i></i><i></i><i></i></div>
<h1>LIMI <span>SMART KEY</span></h1>
<div class="sub">Remote Central Locking</div>
<div class="pill">Audi Q3 • 2013</div>
<div class="conn">● Connected</div>

<div class="keywrap"><div class="key"><div class="inner">
<button class="kb" onclick="s('OPEN - HAPUR')"><svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 9.5-2" stroke="#fff" stroke-width="2.4" fill="none"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff"/><circle cx="12" cy="16" r="1.8" fill="#000"/></svg></button>
<button class="kb" onclick="s('CLOSE - MBYLLUR')"><svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#fff" stroke-width="2.4" fill="none"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff"/><circle cx="12" cy="16" r="1.8" fill="#000"/></svg></button>
<button class="kb" onclick="s('TRUNK - BAGAZHI')"><svg viewBox="0 0 24 24"><path d="M2 17 L4 12 Q5 10 8 10 L11 10 L14 8 Q15 7 17 7 L20 10 L22 12 L22 17 Z" fill="#fff"/><path d="M14 8 L20 5" stroke="#fff" stroke-width="1.8"/><circle cx="6.5" cy="17" r="2.2" fill="#000"/><circle cx="17.5" cy="17" r="2.2" fill="#000"/><circle cx="6.5" cy="17" r="1" fill="#fff"/><circle cx="17.5" cy="17" r="1" fill="#fff"/></svg></button>
<div class="audi-sm"><i></i><i></i><i></i><i></i></div>
</div></div></div>

<div class="row">
<div class="box" onclick="s('OPEN - HAPUR')"><svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#fff" stroke-width="2.2" fill="none"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff"/></svg><b>OPEN</b><small>HAP</small></div>
<div class="box" onclick="s('CLOSE - MBYLLUR')"><svg viewBox="0 0 24 24"><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#fff" stroke-width="2.2" fill="none"/><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff"/></svg><b>CLOSE</b><small>MBYLL</small></div>
<div class="box" onclick="s('TRUNK - BAGAZHI')"><svg viewBox="0 0 24 24"><path d="M2 17 L4 12 Q5 10 8 10 L11 10 L14 8 Q15 7 17 7 L20 10 L22 12 L22 17 Z" fill="#fff"/><path d="M14 8 L20 5" stroke="#fff" stroke-width="1.8"/><circle cx="6.5" cy="17" r="2.2" fill="#000"/><circle cx="17.5" cy="17" r="2.2" fill="#000"/></svg><b>TRUNK</b><small>BAGAZHI</small></div>
</div>

<div class="carbox">
<img src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=400&q=80">
<div class="ct"><b>ENGINE</b><br>START / STOP<br>NDEZJE / FIKJE</div>
<button id="b" class="sb" onclick="t()">START<br>STOP</button>
</div>

<div class="bot"><span class="g">✔ Smart Key Active</span><span>ᛒ Range: ~10 m</span></div>
<div id="m"></div>
</div>
<script>
let on=false
function s(x){document.getElementById('m').innerText=x}
function t(){on=!on;document.getElementById('b').classList.toggle('on',on);s(on?'MOTORI NDEZUR':'MOTORI FIKUR')}
</script>
</body>
</html>
